packages:
  - apps/*
  - packages/*

# Shared dependency versions. Packages reference these as "catalog:" so the
# whole repo moves together when a version is bumped here.
#
# TypeScript is held at 5.9 deliberately: typescript-eslint caps support at
# <6.1 and the 7.x native compiler is not yet supported by the lint toolchain.
catalog:
  typescript: ~5.9.3
  vitest: ^5.0.0
  '@vitest/coverage-v8': ^5.0.0
  tsx: ^4.23.13
  tsup: ^8.5.1
  '@types/node': ^22.20.2
  zod: ^4.6.2
  fast-check: ^4.10.0

# pnpm 10 refuses to run install scripts unless allowlisted. These are the only
# packages in the tree that legitimately need them (native/prebuilt binaries).
onlyBuiltDependencies:
  - esbuild
  - better-sqlite3
  - argon2
